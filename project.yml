name: MemoryPassport
options:
  bundleIdPrefix: com.vano
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
targets:
  MemoryPassport:
    type: application
    platform: iOS
    sources: [Passport]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vano.memorypassport
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Memory Passport
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
  PassportUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PassportUITests]
    dependencies:
      - target: MemoryPassport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
